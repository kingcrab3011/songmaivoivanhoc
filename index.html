    <script>
      (function() {
        try {
          var saved = localStorage.getItem('van_nghi_luan_theme_settings_v1');
          var isDark = false;
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed.themeMode === 'dark') isDark = true;
            else if (parsed.themeMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
